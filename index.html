<!doctype html>
<!-- App shell page: sets the theme before first paint and shows the start-up splash. -->
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('notare.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('pf-v6-theme-dark', theme === 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/red-hat-text-latin-400-normal.woff2" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Notare</title>
    <style>
      @layer patternfly, reset, tokens, base, components, pages, utilities;
    </style>
    <style>
      html {
        background: #faf8f4;
      }
      html[data-theme='dark'] {
        background: #17151a;
      }
      .startup-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background: #faf8f4;
      }
      html[data-theme='dark'] .startup-splash {
        background: #17151a;
      }
      .startup-splash__logo {
        width: 72px;
        height: 72px;
        background: url('/logo-light.png') center / contain no-repeat;
      }
      html[data-theme='dark'] .startup-splash__logo {
        background-image: url('/logo-dark.png');
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-splash" role="status" aria-label="Loading Notare">
        <div class="startup-splash__logo"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
