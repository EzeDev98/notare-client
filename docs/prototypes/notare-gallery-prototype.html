const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ===================== component builders (same markup and class names as Ahorra's React components) ===================== */
let uid=0; const id=()=>'g'+(++uid);
const Button=(label,{v='primary',block,busy,disabled,act,attrs=''}={})=>`<button type="button" class="ui-button ui-button--${v}${busy?' ui-button--busy':''}${block?' ui-button--block':''}" ${disabled?'disabled':''} ${busy?'aria-busy="true"':''} ${act?`data-act="${act}"`:''} ${attrs}><span class="ui-button__label">${label}</span>${busy?'<span class="ui-spinner ui-spinner--sm ui-button__spinner" aria-hidden="true"></span>':''}</button>`;
const IconBtn=(icon,label,{disabled,badge,pressed,act,attrs=''}={})=>`<button type="button" class="ui-icon-button" aria-label="${label}" ${disabled?'disabled':''} ${pressed!==undefined?`aria-pressed="${pressed}"`:''} ${act?`data-act="${act}"`:''} ${attrs}>${ic(icon)}${badge?`<span class="ui-badge ui-badge--floating">${badge}</span>`:''}</button>`;
const Field=(label,control,{hint,error,optional,fid}={})=>`<div class="ui-form-field"><label class="ui-form-field__label" for="${fid||''}">${label}${optional?'<span class="ui-form-field__optional">Optional</span>':''}</label>${control}${error?`<p class="ui-form-error" id="${fid}-e">${error}</p>`:hint?`<p class="ui-form-field__hint">${hint}</p>`:''}</div>`;
const Text=({value='',ph='',disabled,invalid,type='text',trailing,leading,fid,attrs=''}={})=>`<div class="ui-control${invalid?' ui-control--invalid':''}${disabled?' ui-control--disabled':''}${trailing?' ui-control--trailing':''}">${leading?`<span class="ui-control__affix">${leading}</span>`:''}<input class="ui-control__input" id="${fid||''}" type="${type}" value="${value}" placeholder="${ph}" ${disabled?'disabled':''} ${invalid?'aria-invalid="true"':''} ${attrs}>${trailing||''}</div>`;
const Password=({value='',fid,invalid}={})=>{fid=fid||id();return Text({value,fid,invalid,type:'password',attrs:'autocomplete="new-password" autocapitalize="none" spellcheck="false"',trailing:IconBtn('eye','Show password',{pressed:false,act:'pw',attrs:`data-for="${fid}"`})});};
const Select=(options,{value='',ph,disabled,invalid,fid}={})=>`<div class="ui-control${invalid?' ui-control--invalid':''}${disabled?' ui-control--disabled':''}"><select class="ui-control__input ui-select__input${!value?' ui-select__input--placeholder':''}" id="${fid||id()}" ${disabled?'disabled':''}>${ph?`<option value="" ${!value?'selected':''} disabled>${ph}</option>`:''}${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select>${ic('chev','ui-select__chevron')}</div>`;
const Check=(label,{checked,disabled,hint,kind='checkbox',name}={})=>`<label class="ui-choice ui-choice--${kind}${disabled?' ui-choice--disabled':''}"><span class="ui-choice__control"><input class="ui-choice__input" type="${kind}" ${name?`name="${name}"`:''} ${checked?'checked':''} ${disabled?'disabled':''}><span class="ui-choice__box">${kind==='checkbox'?ic('check','ui-choice__tick'):''}</span></span><span><span class="ui-choice__label">${label}</span>${hint?`<span class="ui-choice__hint">${hint}</span>`:''}</span></label>`;
const Card=(inner,cls='')=>`<div class="ui-card ${cls}">${inner}</div>`;
const Row=(inner)=>`<div class="gallery__row">${inner}</div>`;
const Stack=(inner)=>`<div class="gallery__stack">${inner}</div>`;
const Sample=(label,inner,wide)=>`<div class="gallery__sample${wide?' gallery__sample--wide':''}"><p class="gallery__label">${label}</p>${inner}</div>`;
const Section=(title,note,inner,anchor)=>`<section class="gallery__section" id="${anchor||''}"><h2 class="gallery__title">${title}</h2>${note?`<p class="gallery__note">${note}</p>`:''}${inner}</section>`;

const Logo=(size='md')=>`<span class="ui-logo ui-logo--${size}"><img class="ui-logo__img ui-logo__img--light" src="${LOGO.light}" alt="Notare"><img class="ui-logo__img ui-logo__img--dark" src="${LOGO.dark}" alt="Notare"></span>`;
const Banner=(text,{tone,title,action}={})=>`<div class="ui-banner${tone==='error'?' ui-banner--error':''}">${ic(tone==='error'?'alert':'info','ui-banner__icon')}<div class="ui-banner__text">${title?`<p class="ui-banner__title">${title}</p><p class="ui-banner__body">${text}</p>`:`<p>${text}</p>`}</div>${action?`<div class="ui-banner__action">${action}</div>`:''}</div>`;
const Avatar=(ch,n)=>`<span class="n-avatar" style="--tint:var(--color-cursor-${n})">${ch}</span>`;
const Voice=(state)=>{
  const play=(i)=>IconBtn(i,i==='pause'?'Pause':'Play');
  if(state==='idle') return `<div class="n-voice">${play('play')}<div class="n-voice__track"><div class="ui-bar"><span class="ui-bar__fill" style="width:0%"></span></div></div><span class="n-voice__time">0:42</span></div>`;
  if(state==='playing') return `<div class="n-voice">${play('pause')}<div class="n-voice__track"><div class="ui-bar"><span class="ui-bar__fill" style="width:40%"></span></div></div><span class="n-voice__time">0:17 / 0:42</span></div>`;
  if(state==='recording') return `<div class="n-voice n-voice--recording">${IconBtn('stop','Stop recording')}<span class="n-voice__dot" aria-hidden="true"></span><div class="n-voice__track"><span class="n-voice__time">Recording</span></div><span class="n-voice__time">0:07</span></div>`;
  if(state==='saving') return `<div class="n-voice"><span class="n-voice__mic">${ic('mic')}</span><div class="n-voice__track"><span class="n-voice__state">Saving on this device</span></div><span class="ui-spinner ui-spinner--sm" style="color:var(--color-text-muted)"></span></div>`;
  if(state==='waiting') return `<div class="n-voice">${play('play')}<div class="n-voice__track"><div class="ui-bar"><span class="ui-bar__fill" style="width:0%"></span></div></div><span class="n-voice__state">Not synced</span><span class="n-voice__time">0:42</span></div>`;
  return `<div class="n-voice">${play('play')}<div class="n-voice__track"><span class="n-voice__state n-voice__state--error">Could not upload</span></div>${Button('Retry',{v:'ghost'})}</div>`;
};
const NoteRow=({title,preview,date,voice,shared,selected,restore})=>`<div class="n-row" role="option" tabindex="0" aria-selected="${!!selected}"><div class="n-row__text"><span class="n-row__title">${title}</span><span class="n-row__preview">${preview}</span></div>${restore?`<div class="n-row__meta"><span>${restore}</span></div>${Button('Restore',{v:'secondary'})}`:`<div class="n-row__meta"><span>${date}</span><span class="n-row__glyphs">${voice?ic('mic'):''}${shared?ic('users'):''}</span></div>`}</div>`;

/* ===================== sections ===================== */
const VARIANTS=['primary','secondary','ghost','danger'];
const sections={};

sections.palette=()=>Section('1. Colour (Notare palette)','Only the palette is new. Contrast values are computed live from the resolved colours, so they update when you switch theme. Targets: 4.5 for text, 3 for field borders and icons.',
`<div class="gallery__grid">
 ${Sample('Colour tokens',Stack([['brand','--color-brand'],['on brand','--color-on-brand'],['bg','--color-bg'],['surface','--color-surface'],['text','--color-text'],['muted','--color-text-muted'],['line','--color-line'],['field line','--color-field-line'],['error','--color-error'],['focus tint','--color-focus-tint'],['tile / selected row','--color-tile'],['hover','--color-hover']].map(([l,t])=>`<div class="gallery__row"><span class="gallery__swatch" style="--swatch:var(${t})"></span><span class="gallery__t-sm">${l}</span><span class="gallery__label">${t}</span></div>`).join('')))}
 ${Sample('Collaborator tints (cursor, avatar, selection)',Stack([1,2,3,4,5,6].map(n=>`<div class="gallery__row"><span class="gallery__swatch" style="--swatch:var(--color-cursor-${n})"></span><span class="gallery__t-sm">Collaborator ${n}</span><span class="gallery__label">--color-cursor-${n}</span></div>`).join('')))}
 ${Sample('Contrast (live)',`<table class="gallery__table gallery__t-sm"><thead><tr><th>Pair</th><th>Ratio</th><th>Target</th></tr></thead><tbody id="contrast"></tbody></table>`)}
 ${Sample('Palette in use',Card(`<p class="gallery__t-md">Warm paper background, lavender used sparingly.</p><p class="gallery__t-sm" style="color:var(--color-text-muted)">Muted text, dates and previews.</p><p class="gallery__t-sm"><a class="ui-link">A link in brand</a> · <span class="ui-tag ui-tag--brand">New</span></p>`))}
</div>`,'palette');

sections.buttons=()=>Section('2a. Buttons and links','Hover with a mouse. Press Tab to see the keyboard focus ring. Nothing here may be underlined or outlined.',
`<div class="gallery__grid">
 ${Sample('Default',Row(VARIANTS.map(v=>Button(v,{v})).join('')))}
 ${Sample('Disabled',Row(VARIANTS.map(v=>Button(v,{v,disabled:true})).join('')))}
 ${Sample('Busy (width must not change)',Row(VARIANTS.map(v=>Button(v,{v,busy:true})).join('')))}
 ${Sample('Click to simulate a request (1.5 s)',Row(`<span id="sim">${Button('Confirm',{act:'sim'})}</span>`))}
 ${Sample('Block',Button('Continue',{block:true}))}
 ${Sample('Icon buttons: default, with badge, disabled',Row(IconBtn('menu','Open menu')+IconBtn('bell','2 notifications',{badge:2})+IconBtn('plus','Add',{disabled:true})))}
 ${Sample('Links',Row('<a class="ui-link" href="#buttons">In-app link</a><a class="ui-link" href="https://example.com" target="_blank" rel="noreferrer">External link</a>'))}
</div>`,'buttons');

const Notice=({text,meta,actions='',unread=true})=>`<div class="n-notice"><span class="n-notice__dot${unread?'':' n-notice__dot--read'}" ${unread?'aria-label="Unread"':'aria-hidden="true"'}></span><div class="n-notice__text"><p class="n-notice__title">${text}</p>${meta?`<p class="n-notice__meta">${meta}</p>`:''}</div>${IconBtn('x','Dismiss')}${actions?`<div class="n-notice__actions">${actions}</div>`:''}</div>`;
const PersonRow=({name,user,state,ch,n})=>`<div class="n-person">${Avatar(ch,n)}<div class="n-person__text"><p class="n-person__name">${name}</p><p class="n-person__email">@${user}</p></div>${state==='connected'?'<span class="ui-tag">Connected</span>':state==='pending'?'<span class="ui-tag">Pending</span>'+Button('Cancel',{v:'ghost'}):Button('Invite',{v:'secondary'})}</div>`;
const DeviceRow=({name,seen,current})=>`<div class="n-person"><div class="n-person__text"><p class="n-person__name">${name}</p><p class="n-person__email">${seen}</p></div>${current?'<span class="ui-tag ui-tag--brand">This device</span>':Button('Sign out',{v:'secondary'})}</div>`;
const Accessory=({undo,redo})=>`<div class="n-accessory" role="toolbar" aria-label="Editing">${IconBtn('undo','Undo',{disabled:!undo})}${IconBtn('redo','Redo',{disabled:!redo})}<span class="n-header__spacer"></span>${IconBtn('mic','Voice clip')}</div>`;
const Counter=(n)=>n<19000?'':n>=20000?'<p class="n-counter n-counter--limit" role="status">Limit reached. New text is not saved.</p>':`<p class="n-counter" role="status">${n.toLocaleString('en-US')} of 20,000 characters</p>`;
const TRANSCRIPT='So I was thinking we move the Saturday market trip to the morning, and then lunch with Tolu at one. Remember to bring the shared list.';
const Transcript=({viewer,hidden,fid}={})=>`<div class="n-transcript" ${fid?`id="${fid}"`:''} ${hidden?'hidden':''}><p class="n-transcript__label">Transcript</p><p class="n-transcript__text">${TRANSCRIPT}</p><div class="n-transcript__actions">${Button('Copy',{v:'ghost'})}${viewer?'':Button('Insert into note',{v:'secondary'})}</div></div>`;
const clip=(mid,right='')=>`<div class="n-voice">${IconBtn('play','Play')}<div class="n-voice__track">${mid}</div>${right}</div>`;
const bar='<div class="ui-bar"><span class="ui-bar__fill" style="width:0%"></span></div>';
const T={
  none:()=>clip(bar,'<span class="n-voice__time">0:42</span>'+Button('Transcribe',{v:'ghost'})),
  wait:()=>`<div class="n-voice-wrap">${clip('<span class="n-voice__state">Waiting for connection</span>','<span class="n-voice__time">0:42</span>')}<p class="n-voice__help">Transcription starts when you are back online. The clip is safe on this device.</p></div>`,
  busy:()=>`<div class="n-voice-wrap">${clip('<span class="n-voice__state">Transcribing</span>','<span class="ui-spinner ui-spinner--sm" style="color:var(--color-text-muted)"></span><span class="n-voice__time">0:42</span>')}<p class="n-voice__help">This can take a minute. You can keep writing.</p></div>`,
  done:(o={})=>`<div class="n-voice-wrap">${clip(bar,'<span class="n-voice__time">0:42</span>'+Button(o.hidden?'Show transcript':'Hide transcript',{v:'ghost',act:o.fid?'tr-toggle':undefined,attrs:o.fid?`data-target="${o.fid}"`:''}))}${Transcript(o)}</div>`,
  fail:()=>`<div class="n-voice-wrap">${clip('<span class="n-voice__state n-voice__state--error">Could not transcribe this clip. Try again.</span>',Button('Retry',{v:'ghost'}))}</div>`
};
const notices=()=>[
  Notice({text:'Tolu Bello invited you to connect',meta:'2 min ago',actions:Button('Decline',{v:'ghost'})+Button('Accept',{v:'secondary'})}),
  Notice({text:'Ada Okoye shared “Weekend plan” with you',meta:'1 hour ago',actions:Button('Open',{v:'secondary'})}),
  Notice({text:'Transcript ready',meta:'Weekend plan · Yesterday',actions:Button('Open',{v:'secondary'}),unread:false}),
  Notice({text:'Tolu Bello accepted your invite',meta:'Yesterday',unread:false}),
  Notice({text:'Something new happened',meta:'2 days ago',unread:false})
].join('');

const $=(s,r=document)=>r.querySelector(s);
/* resolved theme, so the logo can pick its light or dark file */
function setResolved(){const r=document.documentElement;const f=r.getAttribute('data-theme');r.setAttribute('data-resolved',f||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}
setResolved();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setResolved);
/* theme */
document.addEventListener('change',e=>{
  const t=e.target.dataset.themeOpt; if(!t) return;
  const root=document.documentElement; t==='system'?root.removeAttribute('data-theme'):root.setAttribute('data-theme',t);
  setResolved();requestAnimationFrame(contrast);
});
/* contrast */
function rgbOf(v){const d=document.createElement('span');d.style.color=v;document.body.appendChild(d);const c=getComputedStyle(d).color;d.remove();const m=c.match(/[\d.]+/g).map(Number);return m.slice(0,3);}
const lum=([r,g,b])=>{const f=x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function contrast(){
  const v=n=>rgbOf(`var(--${n})`);
  const pairs=[['Text on background','color-text','color-bg',4.5],['Muted on background','color-text-muted','color-bg',4.5],['Muted on surface','color-text-muted','color-surface',4.5],['Brand on background (links)','color-brand','color-bg',4.5],['On-brand on brand (primary button)','color-on-brand','color-brand',4.5],['Error on background','color-error','color-bg',4.5],['Field line on surface','color-field-line','color-surface',3],['On-brand on cursor 1 (label)','color-on-brand','color-cursor-1',4.5],['On-brand on cursor 2','color-on-brand','color-cursor-2',4.5],['On-brand on cursor 3','color-on-brand','color-cursor-3',4.5],['On-brand on cursor 4','color-on-brand','color-cursor-4',4.5],['On-brand on cursor 5','color-on-brand','color-cursor-5',4.5],['On-brand on cursor 6','color-on-brand','color-cursor-6',4.5]];
  $('#contrast').innerHTML=pairs.map(([l,a,b,t])=>{const r=ratio(v(a),v(b));return `<tr><td>${l}</td><td>${r.toFixed(2)}</td><td>${t} ${r>=t?'pass':'<span style="color:var(--color-error)">below</span>'}</td></tr>`}).join('');
}
contrast();

/* toasts (Ahorra ToastProvider: portal, max 3, 4 s / 6 s) */
function toast(msg,{tone='neutral',action}={}){
  const box=$('#toasts'); while(box.children.length>=3) box.firstElementChild.remove();
  const t=document.createElement('div'); t.className='ui-toast'; if(tone==='error') t.setAttribute('role','alert');
  t.innerHTML=(tone==='success'?ic('ok','ui-toast__icon ui-toast__icon--success'):tone==='error'?ic('alert','ui-toast__icon ui-toast__icon--error'):'')+`<p class="ui-toast__message">${msg}</p>${action?Button(action,{v:'ghost',act:'toast-x'}):''}${IconBtn('x','Dismiss',{act:'toast-x'})}`;
  box.appendChild(t);
  const done=()=>{t.classList.add('ui-toast--leaving');setTimeout(()=>t.remove(),MOTION.fast)};
  t._d=done; setTimeout(done,(tone==='error'||action)?6000:4000);
}

/* overlays (stack aware, Escape closes the top one, focus returns) */
const stack=[];
function overlay(variant,{title,body,footer,dismissible=true,opener}){
  const el=document.createElement('div'); el.className=`ui-overlay ui-overlay--${variant}`;
  el.innerHTML=`<div class="ui-overlay__scrim"></div><div class="ui-overlay__panel" role="dialog" aria-modal="true" aria-label="${title}"><div class="ui-overlay__head">${title&&variant!=='drawer'?`<h2 class="ui-overlay__title">${title}</h2>`:''}${dismissible?`<span class="ui-overlay__close">${IconBtn('x','Close',{act:'ov-close'})}</span>`:''}</div><div class="ui-overlay__body">${body}</div><div class="ui-overlay__foot">${footer}</div></div>`;
  el.dataset.dismissible=dismissible; el._opener=opener||document.activeElement;
  $('#overlays').appendChild(el); stack.push(el);
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.dataset.visible='true';const f=$('[data-autofocus],button,input,select',el.querySelector('.ui-overlay__body'))||$('button',el);f&&f.focus();}));
  return el;
}
function closeOverlay(el){
  el=el||stack[stack.length-1]; if(!el) return;
  el.dataset.visible='false'; stack.splice(stack.indexOf(el),1);
  if(!stack.length) document.body.style.overflow='';
  setTimeout(()=>{el.remove();el._opener&&el._opener.focus&&el._opener.focus();},MOTION.base);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const top=stack[stack.length-1];if(top&&top.dataset.dismissible!=='false')closeOverlay(top);}
  if(e.key==='Tab'&&stack.length){const top=stack[stack.length-1];const f=[...top.querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
document.addEventListener('click',e=>{const sc=e.target.closest('.ui-overlay__scrim');if(sc){const o=sc.parentElement;if(o.dataset.dismissible!=='false')closeOverlay(o);}});

/* Select popup. The closed control is Ahorra's SelectField unchanged; only the open list is drawn from tokens,
   so its text is the same size, weight and colour as every other menu (the browser's own list is not). */
let selPop=null;
function closeSel(){if(!selPop)return;const p=selPop;selPop=null;run(p.el,[{opacity:1},{opacity:0}],{duration:'fast',ease:'standard',fill:'forwards'}).then(()=>p.el.remove());}
function paintSel(){selPop.el.querySelectorAll('.n-menu__item').forEach((b,i)=>{if(i===selPop.active)b.setAttribute('data-active','');else b.removeAttribute('data-active');});}
function pickSel(i){const {sel}=selPop;const o=sel.options[i];if(!o||o.disabled)return;sel.value=o.value;sel.classList.remove('ui-select__input--placeholder');sel.dispatchEvent(new Event('change',{bubbles:true}));closeSel();sel.focus();}
function openSel(sel){
  closeSel();
  const r=sel.closest('.ui-control').getBoundingClientRect();
  const el=document.createElement('div');el.className='n-menu n-select-pop';el.setAttribute('role','listbox');
  el.innerHTML=[...sel.options].map((o,i)=>`<button type="button" tabindex="-1" role="option" class="n-menu__item" data-i="${i}" aria-selected="${o.selected&&!o.disabled}" ${o.disabled?'aria-disabled="true"':''}>${o.textContent}${o.selected&&!o.disabled?ic('check','n-menu__tick'):''}</button>`).join('');
  document.body.appendChild(el);
  const h=el.offsetHeight;const below=r.bottom+4+h<=innerHeight;
  el.style.left=r.left+'px';el.style.width=r.width+'px';el.style.top=(below?r.bottom+4:r.top-4-h)+'px';
  selPop={el,sel,active:Math.max(0,sel.selectedIndex)};paintSel();
  run(el,[{opacity:0,transform:'translateY(-4px)'},{opacity:1,transform:'none'}],{duration:'fast',ease:'out'});
  el.addEventListener('mousedown',e=>e.preventDefault());
  el.addEventListener('click',e=>{const b=e.target.closest('.n-menu__item');if(b)pickSel(+b.dataset.i);});
  el.addEventListener('mousemove',e=>{const b=e.target.closest('.n-menu__item');if(b&&!b.hasAttribute('aria-disabled')){selPop.active=+b.dataset.i;paintSel();}});
}
document.addEventListener('mousedown',e=>{
  const sel=e.target.closest('.ui-select__input');
  if(sel&&!sel.disabled){e.preventDefault();sel.focus();(selPop&&selPop.sel===sel)?closeSel():openSel(sel);return;}
  if(selPop&&!e.target.closest('.n-select-pop'))closeSel();
},true);
document.addEventListener('keydown',e=>{
  const sel=e.target.closest&&e.target.closest('.ui-select__input');if(!sel)return;
  if(!selPop){if(['Enter',' ','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openSel(sel);}return;}
  const n=sel.options.length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=selPop.active;do{i=(i+(e.key==='ArrowDown'?1:-1)+n)%n;}while(sel.options[i].disabled);selPop.active=i;paintSel();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();pickSel(selPop.active);}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeSel();}
  else if(e.key==='Tab')closeSel();
},true);
addEventListener('resize',closeSel);
addEventListener('scroll',e=>{if(selPop&&!(e.target.closest&&e.target.closest('.n-select-pop')))closeSel();},true);

/* OtpField behaviour (ported from Ahorra's OtpField) */
let otp='';
function paintOtp(invalid){$('#otp-wrap').innerHTML=otpMarkup(otp,invalid);}
const otpIn=()=>[...document.querySelectorAll('#otp-wrap .ui-otp__box')];
document.addEventListener('input',e=>{
  const box=e.target.closest('#otp-wrap .ui-otp__box'); if(!box) return;
  const i=otpIn().indexOf(box); let d=box.value.replace(/\D/g,''); if(!d){box.value=otp[i]||'';return;}
  const inc=otp[i]&&d.length===2?d.slice(-1):d;
  otp=(inc.length===1?otp.slice(0,i)+inc+otp.slice(i+1):(otp.slice(0,i)+inc)).slice(0,6);
  const inv=otp.length===6&&otp!=='123456'; paintOtp(inv); otpIn()[Math.min(otp.length,5)].focus();
});
document.addEventListener('keydown',e=>{
  const box=e.target.closest('#otp-wrap .ui-otp__box'); if(!box) return;
  const i=otpIn().indexOf(box),bx=otpIn();
  if(e.key==='Backspace'){e.preventDefault();if(otp[i]){otp=otp.slice(0,i)+otp.slice(i+1);paintOtp(false);otpIn()[i].focus();}else if(i>0){otp=otp.slice(0,i-1)+otp.slice(i);paintOtp(false);otpIn()[i-1].focus();}}
  if(e.key==='ArrowLeft'){e.preventDefault();bx[Math.max(0,i-1)].focus();}
  if(e.key==='ArrowRight'){e.preventDefault();bx[Math.min(5,i+1)].focus();}
});
document.addEventListener('paste',e=>{
  const box=e.target.closest('#otp-wrap .ui-otp__box'); if(!box) return;
  const d=e.clipboardData.getData('text').replace(/\D/g,''); if(!d) return; e.preventDefault();
  const i=otpIn().indexOf(box); otp=(otp.slice(0,i)+d).slice(0,6); const inv=otp.length===6&&otp!=='123456'; paintOtp(inv); otpIn()[Math.min(otp.length,5)].focus();
});
document.addEventListener('focusin',e=>{const box=e.target.closest('#otp-wrap .ui-otp__box');if(!box)return;box.select();const i=otpIn().indexOf(box);if(i>otp.length)otpIn()[otp.length].focus();});
</script>
